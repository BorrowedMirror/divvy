# cargo-about: third-party notices bundled with releases.
#   cargo about generate --workspace -c .about.toml .about.hbs > THIRD-PARTY-NOTICES.html
# Keep `accepted` in sync with `[licenses].allow` in .deny.toml.
accepted = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
  "CC0-1.0",
  "0BSD",
  "Unlicense",
]
targets = [
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
# Workspace crates are covered by LICENSE (Apache-2.0).
private = { ignore = true }
