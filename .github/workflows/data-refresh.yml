name: Data refresh

# Regenerates the bundled game data (internal/data/assets) and opens a PR only when it changed.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh game data
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The bot's credentials live in the automation environment, which deploys only from master.
    # Its token pushes the branch and opens the PR, so GITHUB_TOKEN only reads, and the PR
    # triggers CI (one opened with GITHUB_TOKEN would not).
    environment: automation
    permissions:
      contents: read
    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Refresh the game data
        # The next step runs the corpus tests and fails the job on errors.
        run: go run ./cmd/datarefresh refresh -check=false
      - name: Update the manifest golden
        # The golden pins record counts, so it moves with the data; the PR diff shows the change.
        run: go test ./internal/data -run TestBundledManifestGolden -update
      - name: Parser, matcher and data tests still pass on the new data
        run: go test ./internal/core/... ./internal/data/...
      - name: Mint a BorrowedMirror Bot token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Open pull request if the data changed
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: automation/data-refresh
          delete-branch: true
          add-paths: |
            internal/data/assets/**
            internal/data/testdata/bundled_manifest.json
          commit-message: |
            build(data): refresh game data

            Scheduled `go run ./cmd/datarefresh refresh` picked up upstream changes to the
            trade2 data endpoints or the game exports.
          title: "build(data): refresh game data"
          body: |
            Automated run of `go run ./cmd/datarefresh refresh` (workflow `${{ github.workflow }}`, run ${{ github.run_id }}).

            Review the manifest diff (`internal/data/assets/manifest.json`, and its golden `internal/data/testdata/bundled_manifest.json`) for unexpected schema or count changes before merging.
          labels: data
