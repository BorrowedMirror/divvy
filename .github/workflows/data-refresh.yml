name: data-refresh

# Regenerates the bundled game data (crates/data/assets) and opens a PR only when it changed.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Kept on purpose: create-pull-request pushes the automation branch with it.
          persist-credentials: true
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: xtask
      - name: cargo xtask data refresh
        run: cargo xtask data refresh
      - name: Data crate still passes its tests
        run: cargo test --locked -p rkl-data
      - name: Open pull request if the data changed
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          token: ${{ github.token }}
          branch: automation/data-refresh
          delete-branch: true
          add-paths: crates/data/assets/**
          commit-message: |
            build(data): refresh game data

            Scheduled `cargo xtask data refresh` picked up upstream changes to the
            trade2 data endpoints or the game exports.
          title: "build(data): refresh game data"
          body: |
            Automated run of `cargo xtask data refresh` (workflow `${{ github.workflow }}`, run ${{ github.run_id }}).

            Review the manifest diff (`crates/data/assets/manifest.json`) for unexpected schema or count changes before merging.
          labels: data
