name: E2E

# End-to-end runs of the Go/Wails app (a test-hook build of cmd/divvy) against e2e/cmd/fake-game
# and a mock trade2 API, driven by the Go tests in e2e/ (`go test -tags e2e ./e2e/...`) over
# the app's test hook. Each job builds the binaries once and runs the e2e/scripts script with
# SKIP_BUILD (-SkipBuild on Windows); the Linux scripts provide the session themselves. The
# app and fake-game logs are uploaded when a job fails.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DIVVY_E2E_ARTIFACTS: ${{ github.workspace }}/target/e2e/logs

jobs:
  linux-x11:
    name: X11 (real hotkey)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/linux-deps
        with:
          extra: xdotool
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      # CI's Test cache for this OS; e2e only restores it.
      - name: Restore the Go cache
        id: go-cache
        uses: $/.github/actions/go-cache
        with:
          name: test
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - name: Build web, app (test hook), wl-keyboard and fake game
        run: |
          pnpm --dir web build
          go build -tags gtk3,testhook -o target/go/divvy-e2e ./cmd/divvy
          go build -o target/e2e/wl-keyboard ./e2e/cmd/wl-keyboard
          go build -o target/e2e/fake-game ./e2e/cmd/fake-game
      - name: Run e2e (script starts Xvfb + openbox in a private D-Bus session)
        env:
          SKIP_BUILD: "1"
        run: bash e2e/scripts/run-x11.sh
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-logs-linux-x11
          path: target/e2e/logs
          if-no-files-found: ignore

  linux-x11-stacking:
    name: X11 (fullscreen stacking)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/linux-deps
        with:
          extra: xdotool wmctrl x11-utils
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      # CI's Test cache for this OS; e2e only restores it.
      - name: Restore the Go cache
        id: go-cache
        uses: $/.github/actions/go-cache
        with:
          name: test
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - name: Build web, app (test hook) and fake game
        run: |
          pnpm --dir web build
          go build -tags gtk3,testhook -o target/go/divvy-e2e ./cmd/divvy
          go build -o target/e2e/fake-game ./e2e/cmd/fake-game
      - name: Check overlay stacking over a fullscreen game (openbox)
        run: bash e2e/scripts/stacking-x11.sh

  linux-wayland:
    name: Wayland (sway)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/linux-deps
        with:
          extra: sway xdg-desktop-portal xdg-desktop-portal-wlr wl-clipboard
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      # CI's Test cache for this OS; e2e only restores it.
      - name: Restore the Go cache
        id: go-cache
        uses: $/.github/actions/go-cache
        with:
          name: test
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - name: Build web, app (test hook), wl-keyboard and fake game
        run: |
          pnpm --dir web build
          go build -tags gtk3,testhook -o target/go/divvy-e2e ./cmd/divvy
          go build -o target/e2e/wl-keyboard ./e2e/cmd/wl-keyboard
          go build -o target/e2e/fake-game ./e2e/cmd/fake-game
      - name: Run e2e (script starts headless sway + portal + virtual keyboard in a D-Bus session)
        env:
          SKIP_BUILD: "1"
          # Debian/Ubuntu install the portal daemons under /usr/libexec.
          PORTAL_LIBEXEC: /usr/libexec
        run: bash e2e/scripts/run-wayland.sh
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-logs-linux-wayland
          path: target/e2e/logs
          if-no-files-found: ignore

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      # CI's Test cache for this OS; e2e only restores it.
      - name: Restore the Go cache
        id: go-cache
        uses: $/.github/actions/go-cache
        with:
          name: test
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - name: Build web, app (test hook) and fake game
        # bash: stop at the first failing command (pwsh would only check the last one).
        shell: bash
        run: |
          pnpm --dir web build
          go build -tags testhook -o target/go/divvy-e2e.exe ./cmd/divvy
          go build -o target/e2e/fake-game.exe ./e2e/cmd/fake-game
      - name: Run e2e
        shell: pwsh
        run: ./e2e/scripts/run-windows.ps1 -SkipBuild
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-logs-windows
          path: target/e2e/logs
          if-no-files-found: ignore

  macos:
    name: macOS
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      # CI's Test cache for this OS; e2e only restores it.
      - name: Restore the Go cache
        id: go-cache
        uses: $/.github/actions/go-cache
        with:
          name: test
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - name: Build web, app (test hook) and fake game
        run: |
          pnpm --dir web build
          go build -tags testhook -o target/go/divvy-e2e ./cmd/divvy
          go build -o target/e2e/fake-game ./e2e/cmd/fake-game
      # WKWebView has no WebDriver; the Go tests drive the app over its test hook.
      - name: Run e2e
        env:
          SKIP_BUILD: "1"
        run: bash e2e/scripts/run-macos.sh
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-logs-macos
          path: target/e2e/logs
          if-no-files-found: ignore
