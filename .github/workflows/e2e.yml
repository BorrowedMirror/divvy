name: e2e

# End-to-end runs of the Go/Wails app (a test-hook build of cmd/rkl) against tools/fake-game
# and a mock trade2 API, driven by the Go tests in e2e/ (`go test -tags e2e ./e2e/...`) over
# the app's test hook. Each job builds the binaries once and runs the e2e/scripts script with
# SKIP_BUILD (-SkipBuild on Windows); the Linux scripts provide the session themselves. The
# app and fake-game logs are uploaded when a job fails.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RKL_E2E_ARTIFACTS: ${{ github.workspace }}/target/e2e/logs

jobs:
  linux-x11:
    name: linux x11 (Xvfb + openbox, real hotkey)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/linux-deps
        with:
          extra: xdotool
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: e2e
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build web, app (test hook), wl-keyboard and fake game
        run: |
          pnpm --dir web build
          go build -tags gtk3,testhook -o target/go/rkl-e2e ./cmd/rkl
          go build -o target/e2e/wl-keyboard ./e2e/cmd/wl-keyboard
          cargo build --locked -p fake-game --target-dir target/e2e
      - name: Run e2e (script starts Xvfb + openbox in a private D-Bus session)
        env:
          SKIP_BUILD: "1"
        run: bash e2e/scripts/run-x11.sh
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-logs-linux-x11
          path: target/e2e/logs
          if-no-files-found: ignore

  linux-x11-stacking:
    name: linux x11 (overlay stacking over a fullscreen game)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/linux-deps
        with:
          extra: xdotool wmctrl x11-utils
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: e2e
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build web, app (test hook) and fake game
        run: |
          pnpm --dir web build
          go build -tags gtk3,testhook -o target/go/rkl-e2e ./cmd/rkl
          cargo build --locked -p fake-game --target-dir target/e2e
      - name: Check overlay stacking over a fullscreen game (openbox)
        run: bash e2e/scripts/stacking-x11.sh

  linux-wayland:
    name: linux wayland (sway headless)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/linux-deps
        with:
          extra: sway xdg-desktop-portal xdg-desktop-portal-wlr
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: e2e
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build web, app (test hook), wl-keyboard and fake game
        run: |
          pnpm --dir web build
          go build -tags gtk3,testhook -o target/go/rkl-e2e ./cmd/rkl
          go build -o target/e2e/wl-keyboard ./e2e/cmd/wl-keyboard
          cargo build --locked -p fake-game --target-dir target/e2e
      - name: Run e2e (script starts headless sway + portal + virtual keyboard in a D-Bus session)
        env:
          SKIP_BUILD: "1"
          # Debian/Ubuntu install the portal daemons under /usr/libexec.
          PORTAL_LIBEXEC: /usr/libexec
        run: bash e2e/scripts/run-wayland.sh
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-logs-linux-wayland
          path: target/e2e/logs
          if-no-files-found: ignore

  windows:
    name: windows
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: e2e
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build web, app (test hook) and fake game
        # bash: stop at the first failing command (pwsh would only check the last one).
        shell: bash
        run: |
          pnpm --dir web build
          go build -tags testhook -o target/go/rkl-e2e.exe ./cmd/rkl
          cargo build --locked -p fake-game --target-dir target/e2e
      - name: Run e2e
        shell: pwsh
        run: ./e2e/scripts/run-windows.ps1 -SkipBuild
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-logs-windows
          path: target/e2e/logs
          if-no-files-found: ignore

  macos:
    name: macos
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: e2e
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build web, app (test hook) and fake game
        run: |
          pnpm --dir web build
          go build -tags testhook -o target/go/rkl-e2e ./cmd/rkl
          cargo build --locked -p fake-game --target-dir target/e2e
      # WKWebView has no WebDriver; the Go tests drive the app over its test hook.
      - name: Run e2e
        env:
          SKIP_BUILD: "1"
        run: bash e2e/scripts/run-macos.sh
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-logs-macos
          path: target/e2e/logs
          if-no-files-found: ignore
