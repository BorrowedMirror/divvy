name: ci-go

# The Go/Wails build (cmd/rkl, internal/...). Runs next to ci.yml until the Rust build is retired.
# Every job builds web/dist first: the Go binary embeds it.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: gofmt + vet (linux, windows, darwin) + golangci-lint + bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/linux-deps
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir web build
      # gofmt; go vet for the host (gtk3), GOOS=windows and GOOS=darwin (purego, since cgo needs
      # the macOS SDK); bindgen -check; golangci-lint (pinned in tools/go.mod) for the same three
      # targets. The tests run in the matrix below.
      - run: go tool -modfile=tools/go.mod wails3 task fmt vet bindings:check lint

  test:
    name: test + coverage + build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - if: runner.os == 'Linux'
        uses: ./.github/actions/linux-deps
      - name: Start Xvfb + openbox
        if: runner.os == 'Linux'
        run: |
          Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          sleep 1
          DISPLAY=:99 openbox &
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir web build
      - name: go vet (native, with cgo)
        run: |
          tags=()
          if [ "$RUNNER_OS" = Linux ]; then tags=(-tags gtk3); fi
          go vet "${tags[@]}" ./...
      - name: go build ./cmd/rkl
        run: |
          tags=()
          if [ "$RUNNER_OS" = Linux ]; then tags=(-tags gtk3); fi
          go build "${tags[@]}" -o target/go/ci/ ./cmd/rkl
      # go test -race, one coverage profile per internal package in target/go/coverage/.
      - name: go test -race + coverage
        run: go tool -modfile=tools/go.mod wails3 task coverage
      - name: Upload coverage (go-core)
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/go/coverage/core.out
          flags: go-core
          name: go-core-${{ matrix.os }}
          disable_search: true
          fail_ci_if_error: false
      - name: Upload coverage (go-data)
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/go/coverage/data.out
          flags: go-data
          name: go-data-${{ matrix.os }}
          disable_search: true
          fail_ci_if_error: false
      - name: Upload coverage (go-trade)
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/go/coverage/trade.out
          flags: go-trade
          name: go-trade-${{ matrix.os }}
          disable_search: true
          fail_ci_if_error: false
      - name: Upload coverage (go-platform)
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/go/coverage/platform.out
          flags: go-platform
          name: go-platform-${{ matrix.os }}
          disable_search: true
          fail_ci_if_error: false
      - name: Upload coverage (go-config)
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/go/coverage/config.out
          flags: go-config
          name: go-config-${{ matrix.os }}
          disable_search: true
          fail_ci_if_error: false
      - name: Upload coverage (go-app)
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/go/coverage/app.out
          flags: go-app
          name: go-app-${{ matrix.os }}
          disable_search: true
          fail_ci_if_error: false
      - name: Upload coverage (go-ipc)
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/go/coverage/ipc.out
          flags: go-ipc
          name: go-ipc-${{ matrix.os }}
          disable_search: true
          fail_ci_if_error: false

  package-windows:
    name: windows installer (cross-compiled)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: apt install nsis
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends nsis
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir web build
      - run: go tool -modfile=tools/go.mod wails3 task package:windows
      - name: Installer contains rkl.exe
        run: 7z l target/go/rkl-*-windows-x64-setup.exe | grep -E ' rkl\.exe$'
