name: contract

# Nightly live smoke against the real trade2 API (leagues, one search, one fetch). These are
# `#[ignore]`d `live_*` tests in kalandra-trade, so they never run in normal CI.
on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - crates/trade/**
      - .github/workflows/contract.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  live:
    # Forks get no network budget from us and must not hammer the API.
    if: github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: contract
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-nextest
      - name: Live trade2 smoke
        run: cargo nextest run --locked --profile ci -p kalandra-trade --run-ignored only -E 'test(live_)'
      - name: Upload junit
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: junit-contract
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore
