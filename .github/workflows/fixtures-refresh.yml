name: Fixtures refresh

# Manually re-records the trade2 wiremock fixtures from the live API at a low request rate
# (`go run ./cmd/datarefresh fixtures`, 2 s between requests) and proposes them as a PR.
on:
  workflow_dispatch:
    inputs:
      league:
        description: League to search (default - first poe2 league from the API)
        required: false
        default: ""
      base_type:
        description: Base type used for the recorded search
        required: false
        default: Leather Belt

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  record:
    name: Record fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The bot's credentials live in the automation environment, which deploys only from master.
    # Its token pushes the branch and opens the PR, so GITHUB_TOKEN only reads, and the PR
    # triggers CI (one opened with GITHUB_TOKEN would not).
    environment: automation
    permissions:
      contents: read
    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Record fixtures
        env:
          LEAGUE: ${{ inputs.league }}
          BASE_TYPE: ${{ inputs.base_type }}
        run: |
          args=(-delay-ms 2000 -base-type "$BASE_TYPE")
          if [ -n "$LEAGUE" ]; then args+=(-league "$LEAGUE"); fi
          go run ./cmd/datarefresh fixtures "${args[@]}"
      - name: Trade tests still pass on the new fixtures
        run: go test ./internal/trade/...
      - name: Mint a BorrowedMirror Bot token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          token: ${{ steps.app-token.outputs.token }}
          branch: automation/fixtures-refresh
          delete-branch: true
          add-paths: internal/trade/testdata/fixtures/**
          commit-message: |
            test(trade): re-record trade api fixtures

            Keeps the wiremock fixtures in line with the live trade2 API shape.
          title: "test(trade): re-record trade api fixtures"
          body: Automated run of `go run ./cmd/datarefresh fixtures` (run ${{ github.run_id }}).
