name: Crowdin

on:
  push:
    branches: [master]
    paths: ["web/src/i18n/locales/en/translation.json"]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crowdin
  cancel-in-progress: false

jobs:
  sync:
    name: Sync translations
    # Requires the secrets CROWDIN_PROJECT_ID and CROWDIN_PERSONAL_TOKEN in the automation environment.
    if: github.repository_owner == 'BorrowedMirror'
    runs-on: ubuntu-latest
    # Credentials as in data-refresh: the bot token pushes and opens the PR.
    environment: automation
    permissions:
      contents: read
    steps:
      - name: Check the Crowdin secrets are set
        id: secrets
        env:
          PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
        run: |
          if [ -n "$PROJECT_ID" ] && [ -n "$TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping the Crowdin sync: CROWDIN_PROJECT_ID and CROWDIN_PERSONAL_TOKEN are not set."
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.secrets.outputs.configured == 'true'
        with:
          # The bot token (below) pushes the branch; a persisted GITHUB_TOKEN would override it.
          persist-credentials: false
      - name: Mint a BorrowedMirror Bot token
        if: steps.secrets.outputs.configured == 'true'
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Upload sources and download translations
        if: steps.secrets.outputs.configured == 'true'
        uses: crowdin/github-action@8f01d54f70f1713ee3f09d82c2bbb2daeac28689 # v2.17.1
        with:
          config: .crowdin.yml
          upload_sources: true
          upload_translations: false
          download_translations: true
          create_pull_request: true
          localization_branch_name: i18n/crowdin
          commit_message: "l10n(web): update translations from crowdin"
          pull_request_title: "l10n(web): update translations from crowdin"
          pull_request_body: "Automated translation sync from Crowdin. The i18n completeness tests in `web/src/i18n/i18n.test.ts` must pass before merging."
          pull_request_base_branch_name: master
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
