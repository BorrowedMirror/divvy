name: CI

# The Go/Wails app (cmd/divvy, internal/...) and the React UI (web/). Every Go job builds web/dist
# first: the Go binary embeds it.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: $/.github/actions/linux-deps
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web build
      # go vet for the host (gtk3), GOOS=windows and GOOS=darwin (purego, since cgo needs the macOS
      # SDK); bindgen and commitconfig -check; golangci-lint (pinned in tools/go.mod, with gofumpt
      # and goimports as its formatters) for the same three targets. The tests run in the matrix
      # below. The Wails CLI runs one task per call and is built without cgo (see WAILS in
      # Taskfile.yml).
      - run: |
          wails=$(CGO_ENABLED=0 go tool -modfile=tools/go.mod -n wails3)
          for t in vet bindings:check commitconfig:check lint; do "$wails" task "$t"; done
      # Known vulnerabilities in reachable code, and the dependency licence policy, for all three
      # targets (cmd/release/notices.go holds the allow-list).
      - run: |
          wails=$(CGO_ENABLED=0 go tool -modfile=tools/go.mod -n wails3)
          for t in vuln licenses:check; do "$wails" task "$t"; done

  # Everything that isn't Go or the web app: the workflows, whitespace and line endings, shell
  # scripts, secrets and known vulnerabilities in what ships.
  checks:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      # actionlint and editorconfig-checker run from the tools module, which pins their versions;
      # the rest are pinned here.
      - name: actionlint
        run: go tool -modfile=tools/go.mod actionlint
      - name: editorconfig-checker
        run: git ls-files -z | xargs -0 go tool -modfile=tools/go.mod editorconfig-checker
      # Preinstalled on GitHub's Ubuntu runners.
      - name: shellcheck
        run: git ls-files -z '*.sh' | xargs -0 shellcheck --format=gcc --severity=warning
      - name: zizmor
        run: pipx run zizmor==1.33.1 --no-progress --format github .github/workflows
      - name: trufflehog
        run: |
          docker run --rm -v "$PWD:/repo:ro" -w /repo \
            trufflesecurity/trufflehog:3.100.1@sha256:9c7a8325d43a4af2960d3f21d61a08981d8a1bf0542e007efa2e47097e386452 \
            --fail --no-update --log-level=-1 filesystem -x .trufflehog .
      # Only what ships: go.mod and the web app's production dependencies (see .osv-scanner.toml).
      - name: osv-scanner
        run: |
          pnpm --dir web sbom --sbom-format cyclonedx --prod --lockfile-only > "$RUNNER_TEMP/web.cdx.json"
          docker run --rm -v "$PWD:/repo:ro" -v "$RUNNER_TEMP:/sbom:ro" -w /repo \
            ghcr.io/google/osv-scanner:v2.7.1@sha256:a70ffffc2bfd33482953e5d6b64c6fcdb30239717a07b0f0d3ab2859ce3e4cde \
            scan source --config .osv-scanner.toml -L go.mod -L /sbom/web.cdx.json

  test:
    name: Test (${{ matrix.label }})
    permissions:
      contents: read
      id-token: write # upload coverage to Codecov without a token (OIDC)
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux
          - os: macos-latest
            label: macOS
          - os: windows-latest
            label: Windows
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - if: runner.os == 'Linux'
        uses: $/.github/actions/linux-deps
      - name: Start Xvfb + openbox
        if: runner.os == 'Linux'
        run: |
          Xvfb :99 -screen 0 1920x1080x24 -nolisten tcp &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          sleep 1
          DISPLAY=:99 openbox &
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web build
      - name: go vet (native, with cgo)
        run: |
          tags=()
          if [ "$RUNNER_OS" = Linux ]; then tags=(-tags gtk3); fi
          go vet "${tags[@]}" ./...
      - name: go build ./cmd/divvy
        run: |
          tags=()
          if [ "$RUNNER_OS" = Linux ]; then tags=(-tags gtk3); fi
          go build "${tags[@]}" -o target/go/ci/ ./cmd/divvy
      # go test -race, one coverage profile per internal package in target/go/coverage/.
      - name: go test -race + coverage
        run: |
          wails=$(CGO_ENABLED=0 go tool -modfile=tools/go.mod -n wails3)
          "$wails" task coverage
      - name: Upload coverage (core)
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          use_oidc: true
          files: target/go/coverage/core.out
          flags: core
          name: core-${{ matrix.os }}
          disable_search: true
          fail_ci_if_error: false
      - name: Upload coverage (data)
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          use_oidc: true
          files: target/go/coverage/data.out
          flags: data
          name: data-${{ matrix.os }}
          disable_search: true
          fail_ci_if_error: false
      - name: Upload coverage (trade)
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          use_oidc: true
          files: target/go/coverage/trade.out
          flags: trade
          name: trade-${{ matrix.os }}
          disable_search: true
          fail_ci_if_error: false
      - name: Upload coverage (platform)
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          use_oidc: true
          files: target/go/coverage/platform.out
          flags: platform
          name: platform-${{ matrix.os }}
          disable_search: true
          fail_ci_if_error: false
      - name: Upload coverage (config)
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          use_oidc: true
          files: target/go/coverage/config.out
          flags: config
          name: config-${{ matrix.os }}
          disable_search: true
          fail_ci_if_error: false
      - name: Upload coverage (app)
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          use_oidc: true
          files: target/go/coverage/app.out
          flags: app
          name: app-${{ matrix.os }}
          disable_search: true
          fail_ci_if_error: false
      - name: Upload coverage (ipc)
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          use_oidc: true
          files: target/go/coverage/ipc.out
          flags: ipc
          name: ipc-${{ matrix.os }}
          disable_search: true
          fail_ci_if_error: false

  package-windows:
    name: Windows installer
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: apt install nsis
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends nsis
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web build
      - run: |
          wails=$(CGO_ENABLED=0 go tool -modfile=tools/go.mod -n wails3)
          "$wails" task package:windows
      - name: Installer contains divvy.exe
        run: 7z l target/go/divvy-*-windows-x64-setup.exe | grep -E ' divvy\.exe$'

  web:
    name: Web
    permissions:
      contents: read
      id-token: write # upload coverage to Codecov without a token (OIDC)
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web lint
      - run: pnpm --dir web typecheck
      - run: pnpm --dir web coverage
      - name: Upload coverage (web)
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          use_oidc: true
          files: web/coverage/lcov.info
          flags: web
          name: web
          disable_search: true
          fail_ci_if_error: false
