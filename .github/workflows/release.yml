name: Release

# Pushing a `v<version>` tag drafts a GitHub release for it; a maintainer reviews and publishes the
# draft by hand. tag-release.yml pushes the tag when a release pull request's
# "release: vX.Y.Z (#N)" commit is merged to master; a tag pushed any other way is refused unless
# it points at that same commit (see docs/contributing/releasing.md).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# Never cancel a release mid-flight; queue instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Check the tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      # Full history, so the tagged commit can be checked against master.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      # A release branch's own "release: vX.Y.Z" commit isn't the one the squash merge puts on
      # master; tagging it would release a commit master never had.
      - name: Tag is on master
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::$GITHUB_REF_NAME points at ${GITHUB_SHA::8}, which isn't on master. Delete the tag; merging the release pull request tags the right commit."
            exit 1
          fi
      # Only the merged "release: vX.Y.Z (#N)" commit, with VERSION set to the same version, is
      # released; a later commit on master carries the same VERSION but isn't the release.
      - name: Tag is the release commit
        id: v
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(.github/scripts/release-commit.sh "$GITHUB_SHA")"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::$TAG points at ${GITHUB_SHA::8} ($(git log -1 --format=%s "$GITHUB_SHA")), not the merged \"release: $TAG (#N)\" commit. Delete the tag; merging the release pull request tags the right commit."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  # Builds, drafts and attests the release in a reusable workflow, so the provenance names it as
  # the signer (SLSA Build Level 3). These permissions are the most its jobs may use; each job
  # takes only what it needs.
  build:
    name: Build
    needs: version
    permissions:
      attestations: write
      contents: write
      id-token: write
    uses: $/.github/workflows/release-slsa.yml
    with:
      version: ${{ needs.version.outputs.version }}
      tag: ${{ needs.version.outputs.tag }}
