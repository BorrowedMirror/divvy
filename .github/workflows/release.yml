name: release

# Tag `v*` (created by `cargo xtask release <version>`) -> draft GitHub release with signed
# bundles, the Tauri updater manifest (latest.json), SHA-256 checksums, an SBOM and
# third-party notices. A maintainer reviews and publishes the draft by hand.
#
# Signing secrets live ONLY in the `release` environment (protected: tags `v*`, required
# reviewers), and only the `build` job enters that environment. The updater public key
# (`TAURI_UPDATER_PUBKEY`, minisign, from `cargo tauri signer generate`) lives there too and is
# merged into the bundle config at build time; see docs/contributing/releasing.md.
#
# Bundles are built by `cargo tauri build`: release profile, default features (`native`) plus
# `tauri/custom-protocol`, which the CLI adds itself. The `test-hook` feature is never enabled
# here and the hook is compiled only with it or with debug assertions.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  draft:
    name: draft release + notes
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Release notes (git-cliff)
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: .cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md
      - name: Create draft release
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=()
          case "$TAG" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$TAG" --draft --verify-tag "${prerelease[@]}" \
            --title "kalandra $TAG" --notes-file RELEASE_NOTES.md
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name == \"$TAG\") | .id")
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: bundle (${{ matrix.name }})
    needs: draft
    environment: release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            args: --bundles msi,nsis
          - name: macos-universal
            os: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
          - name: linux
            os: ubuntu-24.04
            args: --bundles appimage,deb,rpm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - if: runner.os == 'Linux'
        uses: ./.github/actions/linux-deps
        with:
          # AppImage bundling (linuxdeploy) shells out to `file`.
          extra: file
      - run: rustup toolchain install
      - if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: release-${{ matrix.name }}
          save-if: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir web build
      - run: cargo install tauri-cli --version 2.12.4 --locked
      - name: Release bundle config (updater public key) and bundle args
        id: bundle
        shell: bash
        env:
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
          OUT: ${{ runner.temp }}/tauri-release.conf.json
          ARGS: ${{ matrix.args }}
          TAG: ${{ github.ref_name }}
        run: |
          # RPM versions cannot contain `-`, so SemVer pre-releases (v0.2.0-rc.1) ship no rpm.
          case "$TAG" in *-*) ARGS=${ARGS/,rpm/} ;; esac
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"
          if [ -z "$TAURI_UPDATER_PUBKEY" ]; then
            echo "::error::TAURI_UPDATER_PUBKEY is not set in the release environment" >&2
            exit 1
          fi
          jq --arg key "$TAURI_UPDATER_PUBKEY" '.plugins.updater.pubkey = $key' \
            .github/tauri-release.conf.json > "$OUT"
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # action-v0.6.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Updater signatures (latest.json).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS code signing + notarisation (ignored on other runners).
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: apps/desktop
          tauriScript: cargo tauri
          releaseId: ${{ needs.draft.outputs.release_id }}
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          # web/dist is built above; .github/tauri-release.conf.json (merged over tauri.conf.json)
          # skips beforeBuildCommand and enables updater artifacts; the step above adds the
          # updater pubkey, which `createUpdaterArtifacts` requires.
          args: ${{ steps.bundle.outputs.args }} --config ${{ runner.temp }}/tauri-release.conf.json

  attest:
    name: checksums + sbom + notices
    needs: [draft, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-about
      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          gh release download "$TAG" --dir dist --pattern '*'
      - name: SBOM (CycloneDX, Cargo.lock + pnpm-lock.yaml)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: kalandra.cdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Third-party notices
        run: cargo about generate --workspace -c .about.toml .about.hbs -o THIRD-PARTY-NOTICES.html
      - name: SHA-256 checksums (bundles, updater manifest, SBOM, notices)
        run: |
          cp kalandra.cdx.json THIRD-PARTY-NOTICES.html dist/
          rm -f dist/SHA256SUMS.txt
          (cd dist && sha256sum -- *) > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Attach to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$TAG" --clobber \
            SHA256SUMS.txt kalandra.cdx.json THIRD-PARTY-NOTICES.html
