name: Release SLSA

# Builds, drafts and attests a release; called by release.yml once the tag checks out. The build
# lives in this reusable workflow because that is what makes GitHub's artifact attestations SLSA
# Build Level 3: the provenance is signed by this workflow, not by the one that called it, so
# verify with --signer-workflow BorrowedMirror/divvy/.github/workflows/release-slsa.yml.
#
# Assets: the Windows NSIS installer (cross-compiled on Linux), the Linux AppImage, the macOS
# universal DMG, a CycloneDX SBOM, third-party notices, SHA256SUMS.txt and the provenance
# (divvy.intoto.jsonl). Notes are generated by GitHub from the labelled pull requests
# (.github/release.yml).
#
# Updates: every build links in the updater's public key (DIVVY_UPDATER_PUBKEY), and the draft job
# signs the update artifacts (the bare Windows exe, the AppImage, the zipped .app) with
# DIVVY_UPDATER_PRIVATE_KEY into update.json, which installs read from the latest release. The
# public key is a repository variable; the private key lives only in the protected `release`
# environment, which only the draft job uses. Nothing is code-signed yet; see
# docs/contributing/releasing.md. The build jobs only read the repository; only the draft and
# attest jobs can write.
on:
  workflow_call:
    inputs:
      version:
        description: The version being released, without the leading v.
        required: true
        type: string
      tag:
        description: The tag being released.
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Package (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            label: Windows
            os: ubuntu-24.04
          - name: linux
            label: Linux
            os: ubuntu-24.04
          - name: macos
            label: macOS
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - if: matrix.name == 'linux'
        uses: $/.github/actions/linux-deps
        with:
          # linuxdeploy (run by `wails3 generate appimage`) shells out to `file`.
          extra: file
      - if: matrix.name == 'windows'
        name: apt install nsis
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends nsis
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          package_json_file: web/package.json
      # setup-node v4 caches nothing unless `cache` is set, and it is not here.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        # zizmor: ignore[cache-poisoning]
        with:
          node-version: 24
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web build
      - name: task package:${{ matrix.name }}
        env:
          TARGET: ${{ matrix.name }}
          VERSION: ${{ inputs.version }}
          # Linked into the build: installs only accept updates signed with its private key.
          DIVVY_UPDATER_PUBKEY: ${{ vars.DIVVY_UPDATER_PUBKEY }}
        run: |
          if [ -z "$DIVVY_UPDATER_PUBKEY" ]; then
            echo "::error::the DIVVY_UPDATER_PUBKEY repository variable is not set" >&2
            exit 1
          fi
          wails=$(CGO_ENABLED=0 go tool -modfile=tools/go.mod -n wails3)
          DIVVY_RELEASE_VERSION="$VERSION" "$wails" task "package:$TARGET"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: divvy-${{ matrix.name }}
          path: |
            target/go/divvy-*.exe
            target/go/divvy-*.AppImage
            target/go/divvy-*.dmg
            target/go/divvy-*.app.zip
          if-no-files-found: error

  draft:
    name: Draft release
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    outputs:
      checksums: ${{ steps.checksums.outputs.checksums }}
    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: divvy-*
          path: dist
          merge-multiple: true
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false
      # Raw ed25519 over each artifact's SHA-256 digest, as Wails' updater verifies it. The URLs
      # point at this release's tag, which exists once the draft is published.
      - name: Sign the update artifacts (update.json)
        env:
          DIVVY_UPDATER_PRIVATE_KEY: ${{ secrets.DIVVY_UPDATER_PRIVATE_KEY }}
          TAG: ${{ inputs.tag }}
          VERSION: ${{ inputs.version }}
        run: |
          go run ./cmd/release update-manifest -version "$VERSION" -dir dist \
            -base-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/"
      - name: SBOM (CycloneDX, go.mod + web/pnpm-lock.yaml)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/divvy.cdx.json
          upload-artifact: false
          upload-release-assets: false
      # The licences of the Go packages linked into the Linux, Windows and macOS builds; fails on
      # any outside the policy in cmd/release/notices.go.
      - name: Third-party notices
        run: go run ./cmd/release notices -o dist/THIRD-PARTY-NOTICES.html
      # Also what the provenance covers: every asset by its SHA-256.
      - name: SHA-256 checksums
        id: checksums
        run: |
          (cd dist && sha256sum -- *) > SHA256SUMS.txt
          cat SHA256SUMS.txt
          echo "checksums=$(base64 -w0 SHA256SUMS.txt)" >> "$GITHUB_OUTPUT"
          mv SHA256SUMS.txt dist/
      # GitHub writes the notes from the merged pull requests since the previous release,
      # grouped by their labels (.github/release.yml).
      - name: Create the draft release with the assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          VERSION: ${{ inputs.version }}
        run: |
          prerelease=()
          case "$VERSION" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$TAG" --draft "${prerelease[@]}" --verify-tag \
            --title "divvy $VERSION" --generate-notes dist/*

  # Signs SLSA provenance with Sigstore through GitHub's artifact attestations, in a job of its own
  # so the build steps never hold the signing token. The bundle is attached to the draft release
  # as divvy.intoto.jsonl, and GitHub keeps it too, where gh attestation verify finds it.
  attest:
    name: Attest
    needs: draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      attestations: write # store the attestation on GitHub
      contents: write # attach divvy.intoto.jsonl to the draft release
      id-token: write # sign the provenance with Sigstore (OIDC)
    steps:
      - name: Harden the runner (audit all outbound calls)
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - name: Write checksums
        env:
          CHECKSUMS: ${{ needs.draft.outputs.checksums }}
        run: printf '%s' "$CHECKSUMS" | base64 -d > "$RUNNER_TEMP/SHA256SUMS.txt"
      - name: Attest the assets
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/SHA256SUMS.txt
      - name: Attach the provenance to the draft release
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          jq -c . "$BUNDLE" > "$RUNNER_TEMP/divvy.intoto.jsonl"
          gh release upload "$TAG" "$RUNNER_TEMP/divvy.intoto.jsonl" --repo "$GITHUB_REPOSITORY" --clobber
