name: Linux system dependencies
description: Installs the GTK3/WebKitGTK, Wayland and headless-display packages the divvy Go build and its tests need on Ubuntu.
inputs:
  extra:
    description: Additional apt packages (space separated).
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: apt install
      shell: bash
      env:
        EXTRA: ${{ inputs.extra }}
      run: |
        sudo apt-get update -q
        # The cgo pkg-config packages of the gtk3 build:
        #   Wails: gtk+-3.0, webkit2gtk-4.1, libsoup-3.0, gio-unix-2.0 and x11 (its X11 global
        #   shortcuts); the tray talks D-Bus from Go (godbus), so no appindicator library.
        #   internal/platform/wayland: gtk-layer-shell-0 (overlay), wayland-client and xkbcommon
        #   (virtual keyboard), also used by e2e/cmd/fake-game and e2e/cmd/wl-keyboard.
        #   X11 input goes over xgb in pure Go, so no libXtst.
        # Xvfb + openbox give the display-server tests and e2e an X11 session; dbus their session bus.
        # shellcheck disable=SC2086 # EXTRA is a word list by design.
        sudo apt-get install -y --no-install-recommends \
          libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libgtk-layer-shell-dev \
          libx11-dev libwayland-dev libxkbcommon-dev \
          pkg-config xvfb openbox dbus $EXTRA
