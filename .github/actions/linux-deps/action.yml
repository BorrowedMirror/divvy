name: Linux system dependencies
description: Installs the Tauri/WebKitGTK, input and headless-display packages kalandra needs on Ubuntu.
inputs:
  extra:
    description: Additional apt packages (space separated).
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: apt install
      shell: bash
      env:
        EXTRA: ${{ inputs.extra }}
      run: |
        sudo apt-get update -q
        # shellcheck disable=SC2086 # EXTRA is a word list by design.
        sudo apt-get install -y --no-install-recommends \
          libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
          libxdo-dev libgtk-layer-shell-dev libei-dev xvfb openbox $EXTRA
