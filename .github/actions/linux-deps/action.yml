name: Linux system dependencies
description: Installs the Tauri/WebKitGTK, input and headless-display packages kalandra needs on Ubuntu.
inputs:
  extra:
    description: Additional apt packages (space separated).
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: apt install
      shell: bash
      env:
        EXTRA: ${{ inputs.extra }}
      run: |
        sudo apt-get update -q
        # Tauri/WebKitGTK + tray; gtk-layer-shell (Wayland overlay, kalandra-desktop);
        # libX11/libXtst (rdev XRecord hook), libxkbcommon (enigo wayland), libdbus (tray).
        # libei is not linked: kalandra-platform keeps enigo's libei feature off.
        # Xvfb + openbox give the display-server tests and e2e an X11 session.
        # shellcheck disable=SC2086 # EXTRA is a word list by design.
        sudo apt-get install -y --no-install-recommends \
          libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
          libgtk-layer-shell-dev libx11-dev libxtst-dev libxkbcommon-dev libdbus-1-dev \
          pkg-config xvfb openbox dbus $EXTRA
