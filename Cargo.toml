[workspace]
resolver = "3"
members = [
  "crates/core",
  "crates/data",
  "crates/trade",
  "crates/platform",
  "crates/config",
  "crates/testkit",
  "apps/desktop/src-tauri",
  "tools/fake-game",
  "xtask",
]
default-members = [
  "crates/core",
  "crates/data",
  "crates/trade",
  "crates/platform",
  "crates/config",
  "crates/testkit",
]

[workspace.package]
version = "0.1.0-rc.1"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nightah/kalandra"
authors = ["kalandra contributors"]
publish = false

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage_nightly)"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
doc_markdown = "allow"
unused_async = "allow"
needless_pass_by_value = "allow"

[workspace.dependencies]
kalandra-core = { path = "crates/core" }
kalandra-data = { path = "crates/data" }
kalandra-trade = { path = "crates/trade" }
kalandra-platform = { path = "crates/platform" }
kalandra-config = { path = "crates/config" }
kalandra-testkit = { path = "crates/testkit" }

anyhow = "1"
signal-hook = "0.3"
async-trait = "0.1"
clap = { version = "4.6", features = ["derive", "env"] }
directories = "6"
futures = "0.3"
http = "1"
moka = { version = "0.12", features = ["future"] }
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "http2", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
specta = { version = "=2.0.0-rc.26", features = ["derive", "serde_json"] }
specta-typescript = "0.0.13"
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
thiserror = "2"
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = { version = "2", features = ["serde"] }
xshell = "0.2"
zstd = "0.13"

# platform
arboard = "3.6"
enigo = "0.6"
global-hotkey = "0.7"
raw-window-handle = "0.6"
rdev = { git = "https://github.com/rustdesk-org/rdev", branch = "master" }
x11rb = "0.13"
ashpd = "0.12"
winit = "0.30"
softbuffer = "0.4"

# tauri
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-build = { version = "2", features = [] }
tauri-plugin-opener = "2"

# test
insta = { version = "1", features = ["json", "yaml", "redactions"] }
mockall = "0.14"
proptest = "1"
wiremock = "0.6"
pretty_assertions = "1"
tempfile = "3"

[profile.release]
lto = true
strip = true
codegen-units = 1
opt-level = 3
panic = "abort"

[profile.dev.package."*"]
opt-level = 1
