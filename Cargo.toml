[workspace]
resolver = "3"
members = [
  "crates/core",
  "crates/data",
  "crates/trade",
  "crates/platform",
  "crates/config",
  "crates/testkit",
  "apps/desktop/src-tauri",
  "tools/fake-game",
  "xtask",
]
default-members = [
  "crates/core",
  "crates/data",
  "crates/trade",
  "crates/platform",
  "crates/config",
  "crates/testkit",
]

[workspace.package]
version = "0.1.0-rc.1"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nightah/rust-king-ledger"
authors = ["rkl contributors"]
publish = false

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage_nightly)"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
doc_markdown = "allow"
unused_async = "allow"
needless_pass_by_value = "allow"

[workspace.dependencies]
rkl-core = { path = "crates/core" }
rkl-data = { path = "crates/data" }
rkl-trade = { path = "crates/trade" }
rkl-platform = { path = "crates/platform" }
rkl-config = { path = "crates/config" }
rkl-testkit = { path = "crates/testkit" }

anyhow = "1"
signal-hook = "0.3"
async-trait = "0.1"
clap = { version = "4.6", features = ["derive", "env"] }
directories = "6"
futures = "0.3"
http = "1"
moka = { version = "0.12", features = ["future"] }
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "http2", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
specta = { version = "=2.0.0-rc.26", features = ["derive", "serde_json"] }
specta-typescript = "0.0.13"
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
thiserror = "2"
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
toml = "0.9"
oozextract = { version = "0.5.7", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = { version = "2", features = ["serde"] }
xshell = "0.2"
zstd = "0.13"

# platform
arboard = "3.6"
enigo = "0.6"
global-hotkey = "0.7"
raw-window-handle = "0.6"
rdev = { git = "https://github.com/rustdesk-org/rdev", branch = "master" }
x11rb = "0.13"
ashpd = "0.12"
winit = "0.30"
softbuffer = "0.4"

# tauri
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-build = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"

# test
insta = { version = "1", features = ["json", "yaml", "redactions"] }
mockall = "0.14"
proptest = "1"
wiremock = "0.6"
pretty_assertions = "1"
tempfile = "3"
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }
gtk = "0.18"
gtk-layer-shell = { version = "0.8", features = ["v0_6"] }
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_System_Threading", "Win32_UI_Accessibility", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
objc2-core-foundation = { version = "0.3", default-features = false }
objc2-core-graphics = { version = "0.3", default-features = false }
objc2-application-services = { version = "0.3", default-features = false }
tauri-nspanel = "2.1"

[profile.release]
lto = true
strip = true
codegen-units = 1
opt-level = 3
panic = "abort"

[profile.dev.package."*"]
opt-level = 1
