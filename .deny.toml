# cargo-deny: `cargo deny check` (run by CI and `cargo xtask lint`).
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Unmaintained-but-not-vulnerable crates deep in the Tauri/zbus tree cannot be replaced by us;
# only flag unmaintained crates we depend on directly.
unmaintained = "workspace"
ignore = [
  # Add `{ id = "RUSTSEC-YYYY-NNNN", reason = "..." }` with a justification and a tracking issue.
  { id = "RUSTSEC-2024-0422", reason = "gtk-layer-shell (GTK3) is unmaintained, but Tauri 2 / WebKitGTK are GTK3-only, so gtk4-layer-shell is not an option; revisit when Tauri moves to GTK4" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# The allow-list is policy, not an inventory: do not warn when an entry is unused today.
unused-allowed-license = "allow"
# Everything here is compatible with distributing rkl under Apache-2.0.
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
  "CC0-1.0",
  "0BSD",
  "Unlicense",
]

[licenses.private]
# Our own unpublished workspace crates (publish = false) are licensed by the workspace.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# rdev fork with Wayland/macOS fixes used by the shared passive hook (crates/platform).
allow-git = ["https://github.com/rustdesk-org/rdev"]
