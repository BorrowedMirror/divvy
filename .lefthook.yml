# Install hooks with `pnpm --dir web exec lefthook install` (pnpm lives in web/).
commit-msg:
  commands:
    commitlint:
      # commitlint is installed in web/; --cwd .. reads .commitlintrc.json from the repo root.
      run: pnpm --dir web exec commitlint --cwd .. --edit {1}
pre-commit:
  parallel: true
  commands:
    rustfmt:
      root: tools/game-extract/
      glob: "*.rs"
      run: cargo fmt -- --check
    gofmt:
      glob: "*.go"
      run: test -z "$(gofmt -l {staged_files})" || { gofmt -l {staged_files}; exit 1; }
    web-lint:
      root: web/
      glob: "*.{ts,tsx,css,json}"
      run: pnpm lint
