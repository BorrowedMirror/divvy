# Install hooks with `pnpm exec lefthook install`.
commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}
pre-commit:
  parallel: true
  commands:
    rustfmt:
      glob: "*.rs"
      run: cargo fmt --all -- --check
    gofmt:
      glob: "*.go"
      run: test -z "$(gofmt -l {staged_files})" || { gofmt -l {staged_files}; exit 1; }
    web-lint:
      root: web/
      glob: "*.{ts,tsx,css,json}"
      run: pnpm lint
