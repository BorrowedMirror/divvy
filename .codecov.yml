# Codecov: one flag per internal Go package (target/go/coverage/<pkg>.out, uploaded by ci.yml)
# plus web (web/coverage/lcov.info).
codecov:
  require_ci_to_pass: true
  notify:
    wait_for_ci: true

coverage:
  precision: 2
  round: down
  range: "70...95"
  status:
    patch:
      default:
        target: 80%
        threshold: 0%
        only_pulls: true
    project:
      default:
        target: auto
        threshold: 1%
      core:
        flags: [core]
        target: 90%
      data:
        flags: [data]
        target: 90%
      trade:
        flags: [trade]
        target: 90%
      config:
        flags: [config]
        target: 90%
      platform:
        flags: [platform]
        target: 70%
      web:
        flags: [web]
        target: 80%

flag_management:
  default_rules:
    carryforward: true
  individual_flags:
    - name: core
      paths: [internal/core/]
    - name: data
      paths: [internal/data/]
    - name: trade
      paths: [internal/trade/]
    - name: platform
      paths: [internal/platform/]
    - name: config
      paths: [internal/config/]
    - name: app
      paths: [internal/app/]
    - name: ipc
      paths: [internal/ipc/]
    - name: web
      paths: [web/src/]

# Go cover profiles name files by import path.
fixes:
  - "github.com/BorrowedMirror/rust-king-ledger/::"

ignore:
  - "tools/**"
  - "cmd/**"
  - "e2e/**"
  - "web/src/bindings.ts"
  - "**/testdata/**"
  - "internal/testkit/**"

comment:
  layout: "condensed_header, diff, flags, files"
  behavior: default
  require_changes: true
