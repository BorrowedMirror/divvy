[package]
name = "fake-game"
description = "Fake 'Path of Exile 2' window that puts corpus items on the clipboard on Ctrl+C"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
# wayland-data-control: serve the clipboard natively under headless sway (wlr-data-control).
arboard = { workspace = true, features = ["wayland-data-control"] }
clap.workspace = true
# A Wayland surface is only mapped once a buffer is committed, so we must actually draw.
softbuffer.workspace = true
winit.workspace = true
