# Single source of truth for conventional-commit types and scopes.
# `go generate ./...` (cmd/commitconfig) regenerates .commitlintrc.json and
# docs/contributing/commit-message.md.

header_max_length = 72

[types]
build = "Changes to the build system or dependencies"
ci = "Changes to CI configuration"
docs = "Documentation only"
feat = "A new feature"
fix = "A bug fix"
i18n = "Internationalisation: the code and tooling that make RKL translatable (not the translations)"
l10n = "Localisation: the translations themselves, usually Crowdin's pull requests"
perf = "A performance improvement"
refactor = "A change that neither fixes a bug nor adds a feature"
release = "Release commits"
test = "Adding or fixing tests"

[scopes]
# packages and apps
core = "internal/core"
data = "internal/data and the data assets (also build(data) for data refreshes)"
trade = "internal/trade"
platform = "internal/platform"
config = "internal/config"
testkit = "internal/testkit"
desktop = "the desktop app: cmd/rkl, internal/app, internal/shell, internal/ipc"
e2e = "e2e/"
xtask = "xtask"
web = "web/"
fake-game = "e2e/cmd/fake-game"
# build-only scopes
deps = "dependency updates (build)"
cargo = "Cargo configuration (build)"
pnpm = "pnpm configuration (build)"
tauri = "Tauri configuration (build)"
# ci-only scopes
github = "GitHub Actions (ci)"
codecov = "Codecov (ci)"
renovate = "Renovate (ci)"
clippy = "Clippy configuration (ci)"
commitlint = "commitlint configuration (ci)"
