# `wails3 dev` (task dev): Vite serves the frontend with hot reload, and every Go change rebuilds
# and restarts the app, which loads its windows from Vite (FRONTEND_DEVSERVER_URL, set by
# wails3 dev). Layout and keys follow Wails' project template.
dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - web
      - target
      - crates
      - apps
      - xtask
      - e2e
      - tools
    file:
      - .DS_Store
      - .gitignore
      - "*_test.go"
    watched_extension:
      - "*.go"
    git_ignore: true
  executes:
    - cmd: go tool -modfile=tools/go.mod wails3 task dev:build
      type: blocking
    - cmd: go tool -modfile=tools/go.mod wails3 task dev:frontend
      type: background
    - cmd: go tool -modfile=tools/go.mod wails3 task dev:run
      type: primary
      exit_policy: shutdown
