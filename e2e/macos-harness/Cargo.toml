[package]
name = "rkl-macos-harness"
description = "e2e harness driving rkl over its test hook (macOS CI; runs on any OS)"
version = "0.1.0-rc.1"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
publish = false

# Standalone on purpose: not a member of the root workspace (whose member list the lead owns),
# so it has its own lockfile and target dir. Build with
#   cargo run --manifest-path e2e/macos-harness/Cargo.toml
[workspace]

[dependencies]
anyhow = "1"
rkl-testkit = { path = "../../crates/testkit" }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }

[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = "0.31"
wayland-protocols-misc = { version = "0.3", features = ["client"] }
