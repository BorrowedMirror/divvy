# golangci-lint v2 configuration for the Go build (`golangci-lint run`; CI: ci.yml).
# The "standard" set plus bug-finding and convention linters (naming, modern Go, context use,
# test style, security); formatting is gofumpt's and goimports' job, applied by `make fmt` and the
# pre-commit hook's --fix.
#
# CI lints three times: host (Linux, gtk3), GOOS=windows, and GOOS=darwin with -tags purego.
version: "2"

run:
  build-tags: [gtk3, testhook, e2e]

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gocritic
    - nilerr
    - unconvert
    - misspell
    - nolintlint
    - usestdlibvars
    - modernize
    - revive
    - sloglint
    - errname
    - noctx
    - usetesting
    - intrange
    - perfsprint
    - predeclared
    - nilnil
    - exhaustive
    - testifylint
    - thelper
    - unparam
    - canonicalheader
    - recvcheck
    - inamedparam
    - forcetypeassert
    - gochecknoinits
    - gosec
  settings:
    gosec:
      excludes:
        - G104 # duplicate of errcheck
        - G103 # unsafe is how cgo and the Win32 calls pass memory
        - G115 # integer conversions sit at syscall and protocol boundaries (X11, Win32, rate limits)
        - G304 # the files read are the app's own (config, cache, logs) or ones the user picked
    revive:
      rules:
        - name: var-naming
        - name: exported
        - name: package-comments
        - name: receiver-naming
        - name: error-naming
        - name: error-strings
        - name: context-as-argument
        - name: unexported-return
        - name: use-any
        - name: redefines-builtin-id
        - name: indent-error-flow
        - name: import-shadowing
    sloglint:
      static-msg: true
      kv-only: true
    exhaustive:
      default-signifies-exhaustive: true
    errcheck:
      exclude-functions:
        # Win32 calls through LazyProc: the error is GetLastError and always non-nil.
        - (*syscall.LazyProc).Call
        - (*golang.org/x/sys/windows.LazyProc).Call
    staticcheck:
      checks:
        - all
        # Quick-fix suggestions (De Morgan and the like), and the style checks revive covers
        # (package comments, comment forms).
        - -QF*
        - -ST1000
        - -ST1020
        - -ST1021
        - -ST1022
    gocritic:
      disabled-checks:
        - ifElseChain
        - singleCaseSwitch
  exclusions:
    generated: strict
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [errcheck, gocritic, forcetypeassert, unparam]
      - path: e2e/
        linters: [thelper]
      # gosec is for what ships: tests, the e2e harness, the test hook and the developer tools
      # in cmd/ (everything but cmd/divvy) run only on developer machines and CI.
      - path: (_test\.go|^e2e/|testhook|^cmd/(bindgen|commitconfig|datarefresh|release)/)
        linters: [gosec]
      # x11's pure files are only called from its _linux.go files, which the Windows and macOS
      # lint runs never see, so unparam reports their test-only arguments as constant there.
      - path: internal/platform/x11/
        linters: [unparam]

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/BorrowedMirror/divvy
