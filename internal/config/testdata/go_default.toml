[league]
auto_detect = true

[overlay]
auto_hide_ms = 400
backdrop_dim = 0.6
close_pinned_on_game_focus = false
group_by_seller = true
listing_columns = ['seller', 'listed']
opacity = 0.95
results = 'below'
scale = 1.0
side = 'cursor'

[overlay.links]
craft_of_exile = true
poe2db = true
wiki = true

[platform]
[stash]
ctrl_scroll_tabs = false
searches = []

[trade]
convert_prices = true
enable_all_stats = false
listing_count = 20
remember_filters = true
sellers = 'any'
source = 'trade'
widen_pct = 10.0

[ui]
autostart = false
check_updates = true
language = 'en'
onboarding_done = false
start_minimised = true
theme = 'system'

[waystone]
