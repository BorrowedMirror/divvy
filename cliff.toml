# git-cliff: CHANGELOG.md and release notes from conventional commits.
#   git cliff --tag v<version> -o CHANGELOG.md     (cargo xtask release does this)
#   git cliff --latest --strip header              (release.yml release notes)
# Types mirror commit-config.toml.

[changelog]
header = """
# Changelog

All notable changes to kalandra are documented here. The format follows
[Keep a Changelog](https://keepachangelog.com/en/1.1.0/) and the project uses
[Semantic Versioning](https://semver.org/).\n
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{% if commit.breaking %}[**breaking**] {% endif %}\
{{ commit.message | upper_first }} ({{ commit.id | truncate(length=7, end="") }})\
{% endfor %}
{% endfor %}\n
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
commit_preprocessors = [
  { pattern = '\((\w+\s)?#([0-9]+)\)', replace = "([#${2}](https://github.com/nightah/kalandra/issues/${2}))" },
]
# The HTML comments only order the groups; they are stripped in the output.
commit_parsers = [
  { message = "^release", skip = true },
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactoring" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^build\\(data\\)", group = "<!-- 5 -->Game data" },
  { message = "^build\\(deps\\)", group = "<!-- 6 -->Dependencies" },
  { message = "^build", group = "<!-- 7 -->Build" },
  { message = "^test", group = "<!-- 8 -->Tests" },
  { message = "^ci", group = "<!-- 9 -->CI" },
  { message = "^revert", group = "<!-- 10 -->Reverts" },
  { body = ".*security", group = "<!-- 11 -->Security" },
]
